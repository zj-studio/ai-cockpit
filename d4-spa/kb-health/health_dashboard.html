<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库健康度 · 驾驶舱</title>
<style>
:root{
  --bg:#070A14;--bg-2:#0B1020;
  --panel:rgba(20,28,52,.72);--panel-2:rgba(15,22,42,.85);
  --line:rgba(120,150,220,.14);--line-strong:rgba(120,160,255,.30);
  --txt:#EAF0FF;--txt-2:#9AA7C7;--txt-3:#5E6B8D;
  --cyan:#38E1FF;--blue:#4D7CFE;--violet:#8B7BFF;
  --green:#3DDCA0;--amber:#FFC24D;--red:#FF6B7A;--pink:#FF7AC6;
  --glass:var(--panel-2);--border:var(--line);--border-strong:var(--line-strong);--accent:var(--cyan);
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--txt);
  background-image:
    radial-gradient(900px 500px at 12% -8%,rgba(77,124,254,.16),transparent 60%),
    radial-gradient(800px 480px at 92% -4%,rgba(56,225,255,.10),transparent 55%),
    radial-gradient(700px 600px at 50% 118%,rgba(139,123,255,.10),transparent 60%);
  background-attachment:fixed;line-height:1.6;min-height:100vh;
}
a{color:inherit}
.app{max-width:1200px;margin:0 auto;padding:0 26px 70px}
.top{display:flex;align-items:center;gap:16px;padding:0 26px;height:64px;position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,rgba(14,20,40,.97),rgba(9,14,30,.92));
  border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:15px;letter-spacing:.5px;white-space:nowrap}
.logo-mark{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;position:relative;
  background:linear-gradient(135deg,#FF4D97,#9B7BFF);
  box-shadow:0 6px 20px rgba(255,77,151,.45),inset 0 0 10px rgba(255,255,255,.18)}

.logo .lname{font-size:15px;font-weight:800;line-height:1.25}
.logo small{display:block;font-size:10.5px;font-weight:500;color:var(--txt-3);letter-spacing:.6px;margin-top:1px}

.phead{display:flex;align-items:flex-end;justify-content:space-between;margin:24px 0 20px;flex-wrap:wrap;gap:10px}
.phead h2{font-size:25px;font-weight:800;display:flex;align-items:center;gap:11px}
.phead h2 .barline{width:4px;height:22px;border-radius:2px;background:linear-gradient(var(--cyan),var(--blue))}
.phead .crumb{font-size:12px;color:var(--txt-3)}
.phead .crumb b{color:var(--cyan)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:rgba(20,28,52,.55);border:1px solid var(--line);border-radius:14px;padding:15px 16px;
  position:relative;overflow:hidden;transition:.3s}
.kpi:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.kpi::after{content:"";position:absolute;right:-22px;top:-22px;width:84px;height:84px;border-radius:50%;
  background:radial-gradient(circle,rgba(155,123,255,.16),transparent 70%)}
.kpi .kl{font-size:12px;color:var(--txt-2);display:flex;align-items:center;gap:6px}
.kpi .kl svg{width:15px;height:15px;stroke:var(--txt-3);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.kpi .kv{font-size:27px;font-weight:800;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .kv small{font-size:12px;font-weight:500;color:var(--txt-3);margin-left:3px}
.kpi .kt{font-size:10.5px;color:var(--txt-3)}
.kpi.warn .kv{color:var(--amber)}
.kpi.bad .kv{color:var(--red)}
body.embedded .top{display:none}
body.embedded .app{padding-top:6px}
.grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-top:14px}
.grid-2.reverse{grid-template-columns:1fr 1.55fr}
.panel{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;min-width:0}
.panel h4{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.panel h4 .barline{width:3px;height:13px;border-radius:2px;background:linear-gradient(var(--cyan),var(--blue))}
.panel .hint{font-size:11px;color:var(--txt-3)}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:10px}
.metric{font-size:12.5px;color:var(--txt-2);margin:8px 0 10px}
.metric b{color:var(--cyan);font-variant-numeric:tabular-nums}
.metric b.warn{color:var(--amber)}.metric b.bad{color:var(--red)}.metric b.ok{color:var(--green)}
.bar{background:rgba(255,255,255,.06);border-radius:6px;height:8px;width:100%;overflow:hidden}
.bar>div{background:linear-gradient(90deg,var(--cyan),var(--blue));height:8px;border-radius:6px}
.bar>div.warn{background:linear-gradient(90deg,var(--amber),var(--pink))}
.bar>div.ok{background:linear-gradient(90deg,var(--green),var(--cyan))}
.table-wrap{overflow-x:auto;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{font-size:11px;color:var(--txt-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:9px 10px;border-bottom:1px solid rgba(120,150,220,.08);vertical-align:top}
tbody tr:hover{background:rgba(255,255,255,.03)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .src{font-family:Consolas,ui-monospace;font-size:11px;color:var(--txt-2);word-break:break-all}
td .badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:700}
.badge.g{color:var(--green);background:rgba(61,220,160,.12)}
.badge.a{color:var(--amber);background:rgba(255,194,77,.12)}
.badge.r{color:var(--red);background:rgba(255,107,122,.12)}
.badge.c{color:var(--cyan);background:rgba(56,225,255,.12)}
.empty{color:var(--txt-3);font-size:12.5px;padding:14px 10px}
.err{color:var(--red);padding:40px;text-align:center}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-2.reverse{grid-template-columns:1fr}}
@media(max-width:640px){.app{padding:0 14px 60px}.top{padding:0 14px}.logo{gap:8px}.logo-mark{width:32px;height:32px;border-radius:9px}.logo-mark svg{width:17px;height:17px}.logo .lname{font-size:12px}.logo small{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><span class="logo-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
    <div><div class="lname">AI 运营监管与协同自治中枢</div><small>KNOWLEDGE HEALTH · 知识库健康度 v1.1</small></div>
  </div>

</div>
<main class="app">
  <div class="phead">
    <h2><span class="barline"></span>知识库健康度</h2>
    <div class="crumb" id="crumb">加载中…</div>
  </div>
  <div id="app"><div class="err">加载中…</div></div>
</main>
<script>
var DATA_FILE='health_dashboard.json';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function num(v,unit){return (v==null||v==='')?'—':'<b>'+esc(v)+'</b>'+(unit?'<small>'+esc(unit)+'</small>':'');}
function bar(pct,cls){return '<div class="bar"><div class="'+((cls||'')+'')+'" style="width:'+Math.max(2,Math.min(100,pct))+'%"></div></div>';}

function pctRow(label,val,pct,cls){return '<tr><td>'+esc(label)+'</td><td class="num">'+esc(val)+'</td><td style="width:34%"><div style="display:flex;align-items:center;gap:8px">'+bar(pct,cls)+'<span style="font-size:11px;color:var(--txt-3);min-width:38px;text-align:right">'+pct.toFixed(0)+'%</span></div></td></tr>';}
function render(d){
  var ov=d.overview||{},acc=d.accuracy||{},fr=d.freshness||{},ch=d.changes||{};
  var hr=acc.hit_rate==null?0:acc.hit_rate*100;
  var cover=ov.sources_scanned?(ov.docs/ov.sources_scanned*100):0;
  var stalePct=ov.docs?((fr.stale_count||0)/ov.docs*100):0;
  var gen=String(d.generated_at||'—').replace('T',' ').replace(/\.\d+$/,'');
  document.getElementById('crumb').innerHTML='数据源 <b>'+esc(d.source||'本地知识库')+'</b> · 生成时间 <b>'+esc(gen)+'</b> · 每 5 分钟自动刷新';

  function kviIco(k){var ic={
    docs:'<rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
    slices:'<path d="M12 3.5l8.5 4.5L12 12.5 3.5 8z"/><path d="M3.5 12.5L12 17l8.5-4.5"/><path d="M3.5 16.5L12 21l8.5-4.5"/>',
    gap:'<circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 15.8v.3"/>',
    stale:'<circle cx="12" cy="13" r="8"/><path d="M12 8.5V13l3 2"/><path d="M12 3.2v2.4"/>'
  };return '<svg viewBox="0 0 24 24">'+ic[k]+'</svg>';}
  var cards=[
    ['docs','文档数',num(ov.docs)+'<small>篇</small>','已索引 · 全量收录',''],
    ['slices','切片数',num(ov.slices)+'<small>片</small>','BGE 向量切片',''],
    ['gap','未索引缺口',num(ov.missing_count==null?'—':ov.missing_count)+'<small>条</small>',ov.missing_count?'存在缺口 · 待补录':'覆盖完整 · 无缺口',ov.missing_count?'bad':'warn'],
    ['stale','超期文档',num(fr.stale_count==null?'—':fr.stale_count)+'<small>个</small>',fr.stale_count?('超过 '+fr.stale_threshold_days+' 天 · 待更新'):(fr.stale_threshold_days+' 天内 · 时效达标'),fr.stale_count?'bad':'']
  ].map(function(c){return '<div class="kpi '+c[4]+'"><div class="kl">'+kviIco(c[0])+esc(c[1])+'</div><div class="kv">'+c[2]+'</div><div class="kt">'+esc(c[3])+'</div></div>';}).join('');

  var dsRows=(d.by_dataset?Object.keys(d.by_dataset).map(function(k){var v=d.by_dataset[k];var tot=ov.slices||1;var p=v.slices/tot*100;return pctRow(k,v.slices+' / '+v.docs+' 文档',p);}).join(''):'<tr><td colspan="3" class="empty">无数据</td></tr>');

  var staleRows=(fr.stale_docs&&fr.stale_docs.length)?fr.stale_docs.map(function(s){
    var badge=s.days>180?'<span class="badge r">严重超期</span>':(s.days>90?'<span class="badge a">超期</span>':'');
    return '<tr><td><div class="src">'+esc(s.source)+'</div></td><td class="num">'+s.days+' 天</td><td class="num">v'+(s.version||1)+'</td><td>'+badge+'</td></tr>';
  }).join(''):'<tr><td colspan="4" class="empty">无超期文档</td></tr>';

  var agRows=(acc.by_agent?Object.keys(acc.by_agent).map(function(k){var v=acc.by_agent[k];var p=v.queries?(v.hits/v.queries*100):0;return '<tr><td>'+esc(k)+'</td><td class="num">'+v.queries+'</td><td class="num">'+v.hits+'</td><td class="num">'+p.toFixed(1)+'%</td><td style="width:26%">'+bar(p,p>=80?'ok':'warn')+'</td></tr>';}).join(''):'<tr><td colspan="5" class="empty">无审计数据</td></tr>');

  var lowRows=(acc.low_confidence_queries&&acc.low_confidence_queries.length)?acc.low_confidence_queries.slice(0,8).map(function(q){
    return '<tr><td>'+esc(q.agent)+'</td><td><div class="src">'+esc(q.query)+'</div></td><td class="num">'+q.top_score+'</td></tr>';
  }).join(''):'<tr><td colspan="3" class="empty">无低质量命中</td></tr>';

  document.getElementById('app').innerHTML=
    '<div class="kpis">'+cards+'</div>'+
    '<div class="grid-2">'+
      '<div class="panel"><div class="panel-head"><h4><span class="barline"></span>哪里缺 · 覆盖度</h4><span class="hint">扫描源 vs 已索引</span></div>'+
        '<div class="metric">已索引 <b>'+ov.docs+'</b> / 扫描源 <b>'+(ov.sources_scanned==null?'—':ov.sources_scanned)+'</b> · 缺口 <b class="'+(ov.missing_count?'warn':'ok')+'">'+ov.missing_count+'</b></div>'+bar(cover,ov.missing_count?'warn':'ok')+
        '<div class="table-wrap"><table><thead><tr><th>数据源</th><th class="num">切片 / 文档</th><th>占比</th></tr></thead><tbody>'+dsRows+'</tbody></table></div>'+
      '</div>'+
      '<div class="panel"><div class="panel-head"><h4><span class="barline"></span>哪里旧 · 更新时效</h4><span class="hint">mtime 距今天数</span></div>'+
        '<div class="metric">超期文档 <b class="'+(fr.stale_count?'warn':'ok')+'">'+fr.stale_count+'</b> 个（阈值 '+fr.stale_threshold_days+' 天）</div>'+bar(stalePct,fr.stale_count?'warn':'ok')+
        '<div class="table-wrap"><table><thead><tr><th>文档</th><th class="num">距今天数</th><th class="num">版本</th><th>状态</th></tr></thead><tbody>'+staleRows+'</tbody></table></div>'+
      '</div>'+
    '</div>'+
    '<div class="grid-2 reverse">'+
      '<div class="panel"><div class="panel-head"><h4><span class="barline"></span>哪里不准 · 检索命中率</h4><span class="hint">按 Agent</span></div>'+
        '<div class="metric">查询 <b>'+acc.total_queries+'</b> · 命中 <b>'+acc.hit_queries+'</b> · 命中率 <b>'+hr.toFixed(1)+'%</b> · 平均命中 <b>'+acc.avg_hit_count+'</b></div>'+bar(hr,hr>=80?'ok':'warn')+
        '<div class="table-wrap"><table><thead><tr><th>Agent</th><th class="num">查询</th><th class="num">命中</th><th class="num">命中率</th><th>分布</th></tr></thead><tbody>'+agRows+'</tbody></table></div>'+
      '</div>'+
      '<div class="panel"><div class="panel-head"><h4><span class="barline"></span>低质量命中</h4><span class="hint">top 分 &lt; '+acc.low_confidence_threshold+'</span></div>'+
        '<div class="metric">低置信 <b class="warn">'+acc.low_confidence_count+'</b> 条</div>'+
        '<div class="table-wrap"><table><thead><tr><th>Agent</th><th>问题</th><th class="num">top</th></tr></thead><tbody>'+lowRows+'</tbody></table></div>'+
      '</div>'+
    '</div>'+
    '<div class="panel" style="margin-top:14px"><div class="panel-head"><h4><span class="barline"></span>更新与变更</h4><span class="hint">refresh 记录</span></div>'+
      '<div class="metric">最近 apply <b>'+esc(ch.last_apply||'—')+'</b> · 累计 apply <b>'+ch.total_applies+'</b></div>'+
    '</div>';
}
if(window.self!==window.top)document.body.classList.add('embedded');
function load(){fetch(DATA_FILE,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(render).catch(function(e){document.getElementById('app').innerHTML='<div class="err">加载失败：'+esc(e.message)+'</div>';});}
load();setInterval(load,300000);
</script>
</body>
</html>
